<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gain Control — Seminar Room 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Saira Semi Condensed", "Arial Narrow", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame {
    position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9;
    container-type: inline-size; user-select: none; -webkit-user-select: none; cursor: crosshair; background: #000;
    /* DAY palette */
    --W: #e9e6ff; --R: #ff3b5c; --B: #6b8cff; --G: #00e39a; --K: #ff95ae; --A: #ffb547;
    --V: #9c7bff; --N: #36346e; --D: #3a3842; --M: #7b7890; --X: #ff3b5c;
  }
  #frame.night {
    --W: #8f9cff; --R: #5a4bd1; --B: #3d5cff; --G: #00e39a; --K: #7064d6; --A: #2fb3a3;
    --V: #4b47c9; --N: #24234f; --D: #1d1c2b; --M: #484673; --X: #ff3b5c;
  }
  svg.t { position: absolute; inset: 0; width: 100%; height: 100%; display: block; fill: none; }
  svg.t path, svg.t line, svg.t circle, svg.t rect, svg.t ellipse, svg.t polyline, svg.t polygon {
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  svg.t .hl { stroke-width: .75; }
  svg.t .mech { stroke-linecap: butt; stroke-linejoin: miter; }
  svg.t .dash { stroke-dasharray: 2 4; }
  svg.t .k { fill: #000; }
  .sW{stroke:var(--W)} .sR{stroke:var(--R)} .sB{stroke:var(--B)} .sG{stroke:var(--G)} .sK{stroke:var(--K)} .sA{stroke:var(--A)}
  .sV{stroke:var(--V)} .sN{stroke:var(--N)} .sD{stroke:var(--D)} .sM{stroke:var(--M)} .sX{stroke:var(--X)} .s0{stroke:#000}
  .fW{fill:var(--W);stroke:none} .fR{fill:var(--R);stroke:none} .fB{fill:var(--B);stroke:none} .fG{fill:var(--G);stroke:none}
  .fK{fill:var(--K);stroke:none} .fA{fill:var(--A);stroke:none} .fV{fill:var(--V);stroke:none} .fX{fill:var(--X);stroke:none}
  .fM{fill:var(--M);stroke:none}
  #frame * { transition: stroke .6s, fill .6s; }
  #frame.night .day-only, #frame:not(.night) .night-only { display: none; }
  [data-hs] { cursor: pointer; }

  /* pose switching (Game & Watch) */
  .pz { display: none; } .pz.on { display: inline; }
  #actor[data-pose="0"] .ap1, #actor[data-pose="0"] .ap2,
  #actor[data-pose="1"] .ap0, #actor[data-pose="1"] .ap2,
  #actor[data-pose="2"] .ap0, #actor[data-pose="2"] .ap1 { display: none; }
  .pt .mouth-b { display: none; } .pt.mo .mouth-b { display: inline; } .pt.mo .mouth-a { display: none; }
  .pt .eyes-closed { display: none; } .pt.bl .eyes-closed { display: inline; } .pt.bl .eyes-open { display: none; }
  .pt .blank-only { display: none; } .pt.blank .blank-only { display: inline; } .pt.blank .normal-only { display: none; }

  /* exit sign glows at night */
  #frame.night #exitChip { filter: drop-shadow(0 0 .5cqw #ff3b5c); }

  /* hover label */
  #hover { position: absolute; pointer-events: none; font-size: 1.15cqw; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: #000; background: var(--W); padding: .05cqw .5cqw; white-space: nowrap; opacity: 0; transition: opacity .1s; }
  #hover.show { opacity: 1; }

  /* narrator box */
  #msg { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); width: 54%; background: #000;
    border: .16cqw solid var(--W); padding: 1cqw 1.4cqw 1.2cqw; color: var(--W); font-size: 1.55cqw; line-height: 1.35; display: none; }
  #msg.show { display: block; }
  .who { display: inline-block; color: #000; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 1.05cqw;
    padding: 0 .45cqw; margin-bottom: .45cqw; }
  .more { position: absolute; right: .9cqw; bottom: .35cqw; font-size: .95cqw; color: var(--M); letter-spacing: .1em; }
  em { color: var(--M); font-style: normal; }

  /* conversation */
  #convo { position: absolute; inset: 0; display: none; background: rgba(0,0,0,.9); }
  #convo.show { display: block; }
  .pf { position: absolute; top: 3.5%; width: 33%; height: 66%; border: .16cqw solid var(--D); background: #000; }
  .pf.left { left: 4%; } .pf.right { right: 4%; }
  .pf.speaking { border-color: var(--W); }
  .pf svg.t { position: absolute; inset: 0; }
  .pf svg.t path, .pf svg.t circle, .pf svg.t rect, .pf svg.t ellipse, .pf svg.t line, .pf svg.t polygon { stroke-width: .62; }
  .pf svg.t .hl { stroke-width: .33; }
  .pf:not(.speaking) svg { opacity: .45; }
  .pf .name { position: absolute; left: 0; bottom: -2.2cqw; }
  #dlg { position: absolute; left: 4%; right: 4%; bottom: 4%; min-height: 15%; background: #000; border: .16cqw solid var(--W);
    padding: .9cqw 1.4cqw 1.1cqw; color: var(--W); font-size: 1.6cqw; line-height: 1.35; }

  /* title card */
  #card { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .7s; }
  #card.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <svg class="t" id="game" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hover"></div>
    <div id="msg"></div>
    <div id="convo">
      <div class="pf left"><div class="pv"></div><span class="who name"></span></div>
      <div class="pf right"><div class="pv"></div><span class="who name"></span></div>
      <div id="dlg"><span class="who"></span><div class="txt"></div><span class="more">CLICK ▸</span></div>
    </div>
    <svg class="t" id="card" viewBox="0 0 640 360"></svg>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const svg = $("#game"), frame = $("#frame");

/* ================================================================ *
 *  TYPE: condensed rounded monoline stroke alphabet (4×6 grid)
 * ================================================================ */
const GL = {
  A:[[0,6,0,1,1,0,3,0,4,1,4,6],[0,3,4,3]], B:[[0,0,0,6],[0,6,3,6,4,5,4,4,3,3,0,3],[0,0,3,0,4,1,4,2,3,3]],
  C:[[4,0,0,0,0,6,4,6]], D:[[0,0,0,6],[0,6,3,6,4,5,4,1,3,0,0,0]], E:[[4,0,0,0,0,6,4,6],[0,3,3,3]], F:[[4,0,0,0,0,6],[0,3,3,3]],
  G:[[4,0,0,0,0,6,4,6,4,3,2,3]], H:[[0,0,0,6],[4,0,4,6],[0,3,4,3]], I:[[1,0,3,0],[2,0,2,6],[1,6,3,6]], J:[[4,0,4,6,0,6,0,4]],
  K:[[0,0,0,6],[4,0,0,3,4,6]], L:[[0,0,0,6,4,6]], M:[[0,6,0,0,2,3,4,0,4,6]], N:[[0,6,0,0,4,6,4,0]],
  O:[[0,0,4,0,4,6,0,6,0,0]], P:[[0,6,0,0],[0,0,4,0,4,3,0,3]], Q:[[0,0,4,0,4,6,0,6,0,0],[2,4,4,6]], R:[[0,6,0,0],[0,0,4,0,4,3,0,3],[1.6,3,4,6]],
  S:[[4,0,0,0,0,3,4,3,4,6,0,6]], T:[[0,0,4,0],[2,0,2,6]], U:[[0,0,0,6,4,6,4,0]], V:[[0,0,2,6,4,0]],
  W:[[0,0,1,6,2,3,3,6,4,0]], X:[[0,0,4,6],[4,0,0,6]], Y:[[0,0,2,3,4,0],[2,3,2,6]], Z:[[0,0,4,0,0,6,4,6]],
  "0":[[0,0,4,0,4,6,0,6,0,0]], "1":[[1,1,2,0,2,6]], "2":[[0,0,4,0,4,3,0,3,0,6,4,6]], "3":[[0,0,4,0,4,6,0,6],[1,3,4,3]],
  "4":[[0,0,0,3,4,3],[4,0,4,6]], "5":[[4,0,0,0,0,3,4,3,4,6,0,6]], "6":[[4,0,0,0,0,6,4,6,4,3,0,3]], "7":[[0,0,4,0,1.4,6]],
  "8":[[0,0,4,0,4,6,0,6,0,0],[0,3,4,3]], "9":[[4,3,0,3,0,0,4,0,4,6,0,6]], "-":[[1,3,3,3]], ".":[[2,6,2,5.6]],
  ":":[[2,1.5,2,1.9],[2,4.5,2,4.9]], "/":[[0,6,4,0]], "!":[[2,0,2,4],[2,5.8,2,6]], "?":[[0,0,4,0,4,3,2,3,2,4],[2,5.8,2,6]],
  "+":[[2,1,2,5],[0,3,4,3]], ">":[[0,0,4,3,0,6]], "<":[[4,0,0,3,4,6]], "'":[[2,0,2,1.5]],
};
function rpath(pts, r) {
  const closed = pts.length > 2 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1];
  if (closed) { const m = [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2]; pts = [m, ...pts.slice(1), m]; }
  const f = (q) => q[0].toFixed(2) + "," + q[1].toFixed(2);
  let d = "M" + f(pts[0]);
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], c = pts[i], b = pts[i + 1];
    const d1 = Math.hypot(c[0] - a[0], c[1] - a[1]), d2 = Math.hypot(b[0] - c[0], b[1] - c[1]);
    if (!d1 || !d2) continue;
    const rr = Math.min(r, d1 * .5, d2 * .5);
    d += "L" + f([c[0] - (c[0] - a[0]) / d1 * rr, c[1] - (c[1] - a[1]) / d1 * rr]) + "Q" + f(c) + " " + f([c[0] + (b[0] - c[0]) / d2 * rr, c[1] + (b[1] - c[1]) / d2 * rr]);
  }
  return d + "L" + f(pts[pts.length - 1]);
}
const CXR = 0.62;
function seg(str, x, y, h, cls, sw = 1.5) {
  const u = h / 6, ux = u * CXR; let out = "", cx = x;
  for (const ch of String(str).toUpperCase()) {
    if (ch === " ") { cx += ux * 3.2; continue; }
    const g = GL[ch]; if (!g) { cx += ux * 5.8; continue; }
    for (const pl of g) { const pts = []; for (let i = 0; i < pl.length; i += 2) pts.push([cx + pl[i] * ux, y + pl[i + 1] * u]);
      out += `<path d="${rpath(pts, u * 1.1)}" class="${cls}" style="stroke-width:${sw}"/>`; }
    cx += ux * 5.8;
  }
  return out;
}
const segW = (str, h) => { const ux = h / 6 * CXR; let w = 0; for (const ch of String(str)) w += ch === " " ? ux * 3.2 : ux * 5.8; return w - ux * 1.8; };
const chip = (txt, x, y, h, fcls, id = "") => `<g ${id ? `id="${id}"` : ""}><rect class="${fcls}" x="${x}" y="${y}" width="${(segW(txt, h) + h * .9).toFixed(1)}" height="${(h * 1.7).toFixed(1)}"/>${seg(txt, x + h * .45, y + h * .35, h, "s0", 1.2)}</g>`;
const arcs = (x, y, dir, cls, n = 3, s = 1) => { let o = ""; for (let i = 0; i < n; i++) { const r = (5 + i * 4) * s, xx = x + dir * i * 4 * s;
  o += `<path class="${cls}" d="M${xx},${y - r} C${xx + dir * r * .6},${y - r * .4} ${xx + dir * r * .6},${y + r * .4} ${xx},${y + r}"/>`; } return o; };

/* ================================================================ *
 *  ROOM GEOMETRY — one-point perspective, native 640×360 (room 0–290)
 * ================================================================ */
const VP = [320, 130], KB = 0.42, FY = 290;
const P = (X, Y, k) => [VP[0] + (X - VP[0]) * k, VP[1] + (Y - VP[1]) * k];
const pt = (a) => a[0].toFixed(1) + "," + a[1].toFixed(1);
const poly = (...a) => a.map(pt).join(" ");
const kAtY = (y) => (y - VP[1]) / (FY - VP[1]);
const ln = (a, b, cls) => `<path class="${cls}" d="M${pt(a)} L${pt(b)}"/>`;

function room() {
  const TL = P(0, 0, KB), TR = P(640, 0, KB), BL = P(0, FY, KB), BR = P(640, FY, KB);
  let s = "";
  // floor perspective grid (hairline, structural)
  for (let X = -160; X <= 800; X += 80) s += ln([X, FY], P(X, FY, KB), "hl sN");
  [0.5, 0.6, 0.72, 0.86].forEach(k => s += ln(P(0, FY, k), P(640, FY, k), "hl sN"));
  // ceiling tiles
  for (let X = 0; X <= 640; X += 64) s += ln([X, 0], P(X, 0, KB), "hl sD");
  [0.5, 0.6, 0.72, 0.86].forEach(k => s += ln(P(0, 0, k), P(640, 0, k), "hl sD"));
  // room edges
  s += `<polyline class="sM" points="${poly([0, 0], TL, TR, [640, 0])}"/><polyline class="sM" points="${poly([0, FY], BL, BR, [640, FY])}"/>`;
  s += ln(TL, BL, "sM") + ln(TR, BR, "sM");
  s += ln(P(0, 170, KB), P(640, 170, KB), "hl sD"); // chair rail

  // projector + beam
  s += `<rect class="k sM mech" x="306" y="20" width="28" height="10"/><path class="sM" d="M320,0 L320,20"/>
        <g class="day-only"><path class="hl dash sM" d="M320,30 L214,88 M320,30 L426,88 M320,30 L214,178 M320,30 L426,178"/><circle class="fW" cx="320" cy="30" r="1.6"/></g>`;
  // screen + slide
  s += `<g data-hs="screen"><rect class="k sW mech" x="214" y="88" width="212" height="90"/>
        <g class="day-only">${slide()}</g>
        <g class="night-only">${brainOutline(268, 136, .9, "hl sD")}</g>
        <rect x="214" y="88" width="212" height="90" fill="transparent"/></g>`;
  s += `<path class="sM mech" d="M214,182 L426,182"/>`;
  // digital clock (right wall)
  s += `<g data-hs="clock"><path class="k sM mech" d="M476,58 L520,50 L520,70 L476,76 Z"/>
        <g class="day-only">${seg("16:07", 481, 57, 9, "sG", 1.2)}</g><g class="night-only">${seg("02:13", 481, 57, 9, "sG", 1.2)}</g>
        <rect x="474" y="48" width="48" height="30" fill="transparent"/></g>`;
  // door + EXIT chip (left wall)
  const d1 = P(0, 120, .62), d2 = P(0, 120, .8), d3 = P(0, FY, .8), d4 = P(0, FY, .62);
  s += `<g data-hs="door"><polygon class="k sW mech" points="${poly(d1, d2, d3, d4)}"/>
        <path class="hl sW" d="M${(d1[0] + d2[0]) / 2 - 2},${d1[1] + 4} L${(d4[0] + d3[0]) / 2 - 2},${(d3[1] + d4[1]) / 2 - 4}"/>
        <path class="sW" d="M74,190 L74,198"/>
        <rect x="58" y="118" width="70" height="146" fill="transparent"/></g>`;
  s += `<g data-hs="exit">${chip("EXIT", 70, 100, 7, "fX", "exitChip")}<rect x="68" y="98" width="30" height="16" fill="transparent"/></g>`;
  // pneumatic tube (right wall), double-line pipe + station
  const tx = P(640, 0, .86)[0], ty0 = P(640, 0, .86)[1], ty1 = P(640, FY, .86)[1];
  const b1 = P(640, 120, .8), b2 = P(640, 120, .9), b3 = P(640, 190, .9), b4 = P(640, 190, .8);
  s += `<g data-hs="tube">
    <path class="sW mech" d="M${tx - 4},${ty0} L${tx - 4},${ty1} M${tx + 4},${ty0} L${tx + 4},${ty1}"/>
    ${[0.1, 0.3, 0.75, 0.9].map(f => { const y = ty0 + (ty1 - ty0) * f; return `<path class="sW mech" d="M${tx - 7},${y} L${tx + 7},${y} M${tx - 7},${y + 2} L${tx + 7},${y + 2}"/>`; }).join("")}
    <polygon class="k sW" points="${poly(b1, b2, b3, b4)}"/>
    <circle class="k sW" cx="${tx}" cy="138" r="6"/><circle class="fW" cx="${tx}" cy="138" r="1.2"/><path id="needle" class="sR" d="M${tx},138 L${tx + 4},134"/>
    <path class="hl sM mech" d="M${tx - 9},150 L${tx + 9},150 L${tx + 9},172 L${tx - 9},172 Z"/><circle class="fG" cx="${tx + 6}" cy="176" r="1.4"/>
    <rect x="${tx - 16}" y="${ty0}" width="32" height="${ty1 - ty0}" fill="transparent"/></g>`;
  s += `<g id="canister" style="display:none"><rect class="fA" x="${tx - 2.6}" y="-6" width="5.2" height="12" rx="2.6"/>${seg("B3", tx + 8, -4, 6, "sA", 1)}</g>`;
  // Morris in the ajar ceiling tile
  const m1 = P(448, 0, .6), m2 = P(512, 0, .6), m3 = P(512, 0, .72), m4 = P(448, 0, .72);
  s += `<g data-hs="morris"><polygon class="k sM" points="${poly(m4, m3, m2, m1)}"/>
    <polygon class="k hl sM" points="${poly(m4, m3, [m3[0] + 4, m3[1] - 8], [m4[0] + 4, m4[1] - 8])}"/>
    <circle class="fA" cx="412" cy="45" r="1.7"/><circle class="fA" cx="419" cy="45" r="1.7"/>
    <g class="pz on" data-g="tail" data-i="0"><path class="sK" d="M424,52 C428,60 420,66 426,74 C430,80 426,84 428,88"/></g>
    <g class="pz" data-g="tail" data-i="1"><path class="sK" d="M424,52 C420,60 428,66 422,74 C418,80 422,84 420,88"/></g>
    <rect x="400" y="34" width="34" height="58" fill="transparent"/></g>`;
  return s;
}
function brainOutline(cx, cy, sc, cls) {
  return `<path class="${cls}" transform="translate(${cx},${cy}) scale(${sc})" d="M-44,6 C-48,-18 -30,-34 -8,-32 C8,-40 32,-34 40,-18 C52,-10 50,10 40,18 C32,30 14,32 4,26 C-6,32 -24,30 -30,22 C-40,22 -46,16 -44,6 Z"/>`;
}
function slide() {
  const cols = ["sR", "sA", "sG", "sB", "sV", "sK"];
  let s = seg("LAMINAR FMRI AT 7T", 222, 94, 7, "sW", 1.1) + chip("7T", 404, 93, 6, "fR");
  cols.forEach((c, i) => { s += brainOutline(266, 140, 1.02 - i * 0.15, (i ? "hl " : "") + c); });
  s += `<path class="sW mech" d="M330,170 L416,170 M330,170 L330,112"/>`;
  [[338, 22, "sM"], [358, 44, "sR"], [378, 14, "sM"]].forEach(([x, h, c]) => {
    s += `<path class="${c} mech" d="M${x},170 L${x},${170 - h} L${x + 12},${170 - h} L${x + 12},170"/><path class="hl sW mech" d="M${x + 6},${168 - h} L${x + 6},${172 - h}"/>`; });
  s += seg("P<.0000001", 352, 114, 5, "sW", .9) + seg("VALU + IMPACT 2026", 222, 170, 4.5, "sM", .8);
  return s;
}

/* ================================================================ *
 *  PEOPLE (sheet coordinates: feet ≈ (160,187))
 * ================================================================ */
function nedFigure() {
  const shoe = (x, y) => `<path class="k sW" d="M${x},${y} L${x + 18},${y} C${x + 22},${y} ${x + 22},${y + 5} ${x + 18},${y + 5} L${x},${y + 5} Z"/>`;
  const head = `
    <path class="k sK" d="M139,54 C138,72 149,82 161,82 C174,82 183,72 183,56"/>
    <path class="sK" d="M140,58 C134,57 133,67 140,68"/>
    <path class="k sR" d="M137,60 C132,41 143,30 156,31 L153,21 L162,28 L166,17 L172,28 L181,22 L180,33 C189,38 189,51 184,59 C180,49 172,45 164,47 C156,43 145,47 137,60 Z"/>
    <path class="sR" d="M149,38 L155,45 M164,33 L166,42 M174,36 L172,44"/>
    <rect class="sW" x="146.5" y="56" width="13" height="10" rx="3"/><rect class="sW" x="166" y="56" width="13" height="10" rx="3"/>
    <path class="sW" d="M159.5,60 L166,60 M146.5,59 L141,58"/>
    <circle class="fW" cx="155" cy="61.5" r="1.6"/><circle class="fW" cx="174.5" cy="61.5" r="1.6"/>
    <path class="sK" d="M168,66 C165,71 168,73 171,72 M162,76 C166,74 170,75 173,77"/>
    <path class="sK" d="M154,80 L154,87 M167,80 L167,87"/>`;
  const torso = `
    <path class="k sG" d="M136,92 C140,87 148,85 153,86 L160,92 L167,86 C172,85 180,87 184,92 L187,128 L133,128 Z"/>
    <path class="sG" d="M153,86 C156,91 164,91 167,86"/><circle class="sG" cx="170" cy="106" r="5"/><path class="sG" d="M168,104 L172,108"/>

    let i = 0, done = false; const tokens = html.match(/<[^>]+>|&[a-z]+;|[\s\S]/g) || [];
    el.innerHTML = "";
    const timer = setInterval(() => { if (i >= tokens.length) { finish(); return; } el.innerHTML += tokens[i++]; onTick && onTick(true); }, speed);
    function finish() { clearInterval(timer); el.innerHTML = html; done = true; onTick && onTick(false); }
    function click(e) { e.stopPropagation(); if (!done) { finish(); return; } frame.removeEventListener("pointerdown", click, true); resolve(); }
    frame.addEventListener("pointerdown", click, true);

}

    else { const p = PORTRAIT[c[side]]; who.textContent = p.name; who.style.background = `var(--${p.chip.slice(1)})`; }
    const sp = side === "N" ? null : els[side];
    if (sp) sp.classList.toggle("blank", fx === "blank");
    const scene = $("#preston"); if (fx === "blank" && scene) scene.classList.add("blank");
    let flap = 0;
    await typeInto(dlg.querySelector(".txt"), esc(text) + (sub ? `<br><em>${esc(sub)}</em>` : ""), state.mode === "night" ? 26 : 18,
      (on) => { if (!sp) return; if (on) { if (++flap % 3 === 0) sp.classList.toggle("mo"); } else sp.classList.remove("mo"); });
    if (sp) { sp.classList.remove("mo"); sp.classList.remove("blank"); }
    if (scene) scene.classList.remove("blank");
  }
  blinkTimers.forEach(clearTimeout); blinkTimers = [];
  convo.classList.remove("show");
  if (c.score) addScore(...c.score);
  if (key === "cPreston") { state.status = "RECORDING"; hud(); setTimeout(() => { state.status = ""; hud(); }, 3500); }
  state.busy = false;
}

/* ---------------- input ---------------- */
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function hsFrom(t) { const el = t.closest && t.closest("[data-hs]"); if (!el) return null; const id = el.dataset.hs, h = HS[id];
  if (!h || !h[state.mode] || state.taken.has(id)) return null; return id; }
const VL = { walk: "Walk to", look: "Look at", use: "Use", talk: "Talk to" };
frame.addEventListener("pointermove", (e) => {
  if (state.busy) { hover.classList.remove("show"); return; }
  const id = hsFrom(e.target), item = e.target.closest && e.target.closest("[data-item]");
  const label = id ? `${VL[state.verb]} ${HS[id].label}` : item ? `Look at ${ITEMS[item.dataset.item].name}` : "";
  if (!label) { hover.classList.remove("show"); return; }
  const r = frame.getBoundingClientRect();
  hover.textContent = label; hover.classList.add("show");
  hover.style.left = (e.clientX - r.left + 14) + "px"; hover.style.top = (e.clientY - r.top + 16) + "px";
});
frame.addEventListener("contextmenu", (e) => { e.preventDefault(); if (!state.busy) setVerb(VERBS[(VERBS.indexOf(state.verb) + 1) % 4]); });
window.addEventListener("keydown", (e) => { const n = +e.key; if (n >= 1 && n <= 4 && !state.busy) setVerb(VERBS[n - 1]); });
svg.addEventListener("click", (e) => {
  if (state.busy) return;
  const v = e.target.closest("[data-verb]"); if (v) { setVerb(v.dataset.verb); return; }
  if (e.target.closest("#toggle")) { toggleMode(); return; }
  const it = e.target.closest("[data-item]"); if (it) { say(ITEMS[it.dataset.item].look); return; }
  const p = svgPoint(e); if (p.y > 290) return;
  const id = hsFrom(e.target); if (id) { act(id); return; }
  if (state.verb !== "walk") setVerb("walk");
  walkTo(p.x, p.y);
});
function act(id) {
  const h = HS[id][state.mode], v = state.verb;
  if (v === "walk") { const s = STAND[id]; if (s) walkTo(s[0], s[1]); return; }
  if (v === "look") { if (h.look) { say(h.look); if (h.score) addScore(...h.score); } return; }
  const resp = h[v] || (v === "talk" ? "No answer. Not even a squeak." : "Nothing happens. Academia in a nutshell.");
  const go = () => {
    if (CONVOS[resp]) { runConvo(resp); return; }
    say(resp);
    if (v === "use" && h.score) addScore(...h.score);
    if (v === "use" && h.take) { state.taken.add(id); const el = document.getElementById(id); if (el) el.style.display = "none"; }
  };
  const s = STAND[id]; if (s) walkTo(s[0], s[1], go); else go();
}

/* ---------------- stepped (Game & Watch) movement ---------------- */
function clampFloor(x, y) { y = Math.max(206, Math.min(287, y)); const k = kAtY(y), half = 320 * k - 16; return [Math.max(320 - half, Math.min(320 + half, x)), y]; }
function walkTo(x, y, cb) { const a = state.actor; [a.tx, a.ty] = clampFloor(x, y); a.cb = cb || null; a.walking = true; }
function render() {
  const a = state.actor, s = kAtY(a.y) * 0.72;
  actorEl.setAttribute("transform", `translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${(a.dir * s).toFixed(3)},${s.toFixed(3)}) translate(-160,-187)`);
  actorEl.setAttribute("data-pose", a.walking ? (a.step % 2 ? 2 : 1) : 0);
  const kids = [...sortables.children].filter(c => c !== actorWrap);
  const after = kids.find(c => parseFloat(c.dataset.depth) > a.y);
  if (actorWrap.nextSibling !== after) sortables.insertBefore(actorWrap, after || null);
}
setInterval(() => {   // one G&W step every 120 ms
  const a = state.actor; if (!a.walking) return;
  const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy), stepLen = 9 * kAtY(a.y) + 3;
  if (d <= stepLen) { a.x = a.tx; a.y = a.ty; a.walking = false; render(); const cb = a.cb; a.cb = null; cb && cb(); return; }
  a.x += dx / d * stepLen; a.y += dy / d * stepLen; if (Math.abs(dx) > 1) a.dir = dx > 0 ? 1 : -1; a.step++; render();
}, 120);

/* ---------------- ambient pose clocks ---------------- */
function poseSet(group, i) { document.querySelectorAll(`[data-g="${group}"]`).forEach(el => el.classList.toggle("on", +el.dataset.i === i)); }
let nod = 0; setInterval(() => poseSet("nod", nod ^= 1), 800);
let tail = 0; setInterval(() => poseSet("tail", tail ^= 1), 650);
let parm = 0; setInterval(() => poseSet("parm", parm ^= 1), 1700);
function blankBlip() { const p = $("#preston"); if (p && state.mode === "day" && !state.busy) { p.classList.add("blank"); setTimeout(() => p.classList.remove("blank"), 700); }
  setTimeout(blankBlip, 5500 + Math.random() * 4000); }
setTimeout(blankBlip, 4200);
const can = $("#canister"), ctx = P(640, 0, .86)[0];
function dropCanister() {   // the canister falls in fixed positions, then vanishes past the floor
  const ys = [24, 48, 72, 100, 128, 200, 226, 252, 276]; let i = 0; can.style.display = "inline";
  const t = setInterval(() => { if (i >= ys.length) { clearInterval(t); can.style.display = "none"; return; } can.setAttribute("transform", `translate(0,${ys[i++]})`); }, 110);
  setTimeout(dropCanister, state.mode === "night" ? 3200 + Math.random() * 2400 : 8000 + Math.random() * 5000);
}
setTimeout(dropCanister, 2200);
setInterval(() => { const a = Math.random() * 1.2 - .9; $("#needle").setAttribute("d", `M${ctx},138 L${(ctx + 5 * Math.cos(a)).toFixed(1)},${(138 + 5 * Math.sin(a)).toFixed(1)}`); }, 300);

/* ---------------- title card + day/night ---------------- */
const card = $("#card");
function showCard() {
  const night = state.mode === "night";
  const t1 = night ? "MONDAY NIGHT" : "MONDAY", t2 = night ? "NIGHT SHIFT  GUS" : "ACT I  SUBMISSION";
  card.innerHTML = `<rect width="640" height="360" fill="#000"/>${seg(t1, 320 - segW(t1, 42) / 2, 128, 42, "sW", 2)}
    ${chip(t2, 320 - (segW(t2, 8) + 7.2) / 2, 196, 8, night ? "fG" : "fA")}
    ${seg(night ? "SEMINAR RM 101  02:13" : "JOURNAL CLUB  SEMINAR RM 101  16:07", 320 - segW(night ? "SEMINAR RM 101  02:13" : "JOURNAL CLUB  SEMINAR RM 101  16:07", 6) / 2, 230, 6, "sM", 1)}`;
  card.classList.add("show"); state.busy = true;
  const hide = () => { card.classList.remove("show"); state.busy = false; card.removeEventListener("click", hide); };
  card.addEventListener("click", hide); setTimeout(hide, 2300);
}
function toggleMode() {
  state.mode = state.mode === "day" ? "night" : "day"; state.status = "";
  frame.classList.toggle("night", state.mode === "night");
  const a = state.actor; Object.assign(a, state.mode === "night" ? { x: 140, y: 278, dir: 1 } : { x: 320, y: 280, dir: 1 }, { walking: false, cb: null });
  drawActor(); render(); hud(); showCard();
}

drawActor(); render(); hud(); showCard();
})();
</script>
