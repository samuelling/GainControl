<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gain Control — Style Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace; color: #f4f1ea; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame {
    position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9;
    container-type: inline-size; user-select: none; -webkit-user-select: none; cursor: crosshair;
    /* DAY palette */
    --dim: #262a36; --dim2: #1b1e28; --line: #5d6378; --white: #f4f1ea;
    --floor: #10172e; --floorline: #1c2547; --wallside: #05070c; --backwall: #07080d;
    --screen: #e9f0ff; --screenglow: #9fc0ff;
    --orange: #ff6b35; --yellow: #ffd23f; --green: #2ee6a8; --blue: #3d8bff; --pink: #ff4d8d; --violet: #9b6bff;
    --exit: #7a2028; --sel: #161b2c; --beam: rgba(200,220,255,.06);
  }
  #frame.night {
    --dim: #121836; --dim2: #0c1028; --line: #2b3a8f; --white: #9db0ff;
    --floor: #03050d; --floorline: #0b1130; --wallside: #000; --backwall: #010208;
    --screen: #04060e; --screenglow: #000;
    --orange: #2b5fb8; --yellow: #29d3c0; --green: #29d3c0; --blue: #3355ff; --pink: #5a4bd1; --violet: #4b47c9;
    --exit: #ff3344; --sel: #0b0f24; --beam: rgba(0,0,0,0);
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #game * { transition: fill .7s ease, stroke .7s ease, opacity .7s ease; }
  #game .noanim, #game .noanim * { transition: none; }

  .day-only, .night-only { transition: opacity .7s; }
  #frame.night .day-only { display: none; }
  #frame:not(.night) .night-only { display: none; }

  /* animations */
  @keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  .nod { animation: nod 1.6s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  .tail { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 2.4s ease-in-out infinite; }
  @keyframes blinkEyes { 0%, 92%, 100% { opacity: 1; } 95% { opacity: .1; } }
  .ratEyes { animation: blinkEyes 5s infinite; }
  @keyframes budPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .bud-glow { animation: budPulse 2.2s ease-in-out infinite; }
  .pulsing .bud-glow { animation: none; opacity: 1; stroke-width: 7; }
  @keyframes implant { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  .implant { animation: implant 1.4s ease-in-out infinite; }

  /* portrait state switches (also used by in-scene Preston) */
  .pt .mouth-b { display: none; }
  .pt.mo .mouth-b { display: inline; }
  .pt.mo .mouth-a { display: none; }
  .pt .eyes-closed { display: none; }
  .pt.bl .eyes-closed { display: inline; }
  .pt.bl .eyes-open { display: none; }
  .pt .blank-only { display: none; }
  .pt.blank .blank-only { display: inline; }
  .pt.blank .normal-only { display: none; }

  /* hotspots */
  [data-hs] { cursor: pointer; }

  /* OLED pixel grid */
  #grid {
    position: absolute; inset: 0; pointer-events: none; opacity: .16; mix-blend-mode: multiply;
    background-image:
      linear-gradient(rgba(0,0,0,.9) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.9) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background:
      repeating-linear-gradient(0deg, rgba(157,176,255,.18) 0 2px, transparent 2px 5px); }
  #flash.go { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* hover label */
  #hover {
    position: absolute; pointer-events: none; font-size: 1.05cqw; letter-spacing: .04em;
    color: var(--white); background: rgba(0,0,0,.75); border: 1px solid var(--line);
    padding: .25cqw .55cqw; border-radius: .3cqw; white-space: nowrap; opacity: 0; transition: opacity .12s;
  }
  #hover.show { opacity: 1; }

  /* narrator / message box */
  #msg {
    position: absolute; left: 50%; top: 7%; transform: translateX(-50%); width: 52%;
    background: #000; border: .18cqw solid var(--white); border-radius: .5cqw;
    padding: 1.2cqw 1.5cqw; font-size: 1.35cqw; line-height: 1.5; display: none;
    box-shadow: 0 0 1.4cqw rgba(157,176,255,.25);
  }
  #msg.show { display: block; }
  #msg .who { font-weight: 700; letter-spacing: .06em; }
  #msg .more { position: absolute; right: .8cqw; bottom: .4cqw; font-size: .9cqw; color: var(--line); }
  #frame.night #msg { color: #b9c6ff; border-color: #3a4bb0; font-size: 1.25cqw; }
  em { color: var(--line); }

  /* conversation overlay */
  #convo { position: absolute; inset: 0; display: none; background: rgba(0,0,0,.82); }
  #convo.show { display: block; }
  .pframe { position: absolute; top: 4%; width: 31%; height: 70%; }
  .pframe.left { left: 3%; } .pframe.right { right: 3%; }
  .pframe .pv { position: absolute; inset: 0; background: #000; border-radius: 1.4cqw; overflow: hidden; }
  .pframe svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: filter .25s; }
  .pframe .plate {
    position: absolute; left: 50%; bottom: -1.2cqw; transform: translateX(-50%);
    background: #000; border: .15cqw solid var(--white); border-radius: .4cqw;
    padding: .2cqw 1cqw; font-weight: 700; letter-spacing: .14em; font-size: 1.1cqw; white-space: nowrap;
  }
  .pframe .ring { position: absolute; inset: 0; border: .18cqw solid var(--line); border-radius: 1.4cqw; }
  .pframe.speaking .ring { border-color: var(--white); box-shadow: 0 0 1.6cqw rgba(157,176,255,.35); }
  .pframe:not(.speaking) svg { filter: brightness(.5) saturate(.8); }
  #frame.night .pframe svg { filter: saturate(.55) hue-rotate(-8deg) brightness(.92); }
  #frame.night .pframe:not(.speaking) svg { filter: saturate(.45) hue-rotate(-8deg) brightness(.45); }
  .pframe .ring { z-index: 2; pointer-events: none; }
  #dlg {
    position: absolute; left: 20%; right: 20%; bottom: 3.5%; min-height: 12%;
    background: #000; border: .18cqw solid var(--white); border-radius: .6cqw;
    padding: 1.1cqw 1.4cqw; font-size: 1.35cqw; line-height: 1.5;
  }
  #dlg .who { font-weight: 700; letter-spacing: .08em; display: block; margin-bottom: .2cqw; font-size: 1.05cqw; }
  #dlg .more { position: absolute; right: .9cqw; bottom: .5cqw; font-size: .9cqw; color: var(--line); }

  /* title card */
  #card {
    position: absolute; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1cqw; opacity: 0; pointer-events: none; transition: opacity .8s;
  }
  #card.show { opacity: 1; pointer-events: auto; }
  #card .day { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 6.4cqw; letter-spacing: .12em; }
  #card .act { font-size: 1.5cqw; letter-spacing: .3em; color: var(--yellow); }
  #card .sub { font-size: 1.1cqw; letter-spacing: .2em; color: var(--line); }
  #card .rule { width: 18cqw; height: .18cqw; background: var(--white); opacity: .6; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <svg id="game" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="grid"></div>
    <div id="flash"></div>
    <div id="hover"></div>
    <div id="msg"></div>
    <div id="convo">
      <div class="pframe left"><div class="ring"></div><div class="pv"></div><div class="plate"></div></div>
      <div class="pframe right"><div class="ring"></div><div class="pv"></div><div class="plate"></div></div>
      <div id="dlg"><span class="who"></span><span class="txt"></span><span class="more">click ▸</span></div>
    </div>
    <div id="card"><div class="day"></div><div class="rule"></div><div class="act"></div><div class="sub"></div></div>
  </div>
</div>

<script>
(() => {
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("game");
const frame = document.getElementById("frame");
const $ = (s, r = document) => r.querySelector(s);

/* ------------------------------------------------------------------ *
 *  Geometry: one-point perspective. Vanishing point (800,220).
 *  k = depth factor: 0.44 at back wall, 1.0 at the picture plane.
 * ------------------------------------------------------------------ */
const VP = [800, 220], KB = 0.44;
const P = (X, Y, k) => [VP[0] + (X - VP[0]) * k, VP[1] + (Y - VP[1]) * k];
const pt = (a) => a[0].toFixed(1) + "," + a[1].toFixed(1);
const poly = (...pts) => pts.map(pt).join(" ");
const kAtY = (y) => (y - VP[1]) / (760 - VP[1]);   // floor depth from screen y

/* ------------------------------------------------------------------ *
 *  ROOM
 * ------------------------------------------------------------------ */
function room() {
  const BL = P(0, 760, KB), BR = P(1600, 760, KB), TL = P(0, 0, KB), TR = P(1600, 0, KB);
  let s = "";
  s += `<defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="screenClip"><rect x="560" y="150" width="490" height="222" rx="4"/></clipPath>
  </defs>`;
  // walls, floor, ceiling
  s += `<rect width="1600" height="760" style="fill:#000"/>`;
  s += `<polygon points="${poly([0,0],TL,BL,[0,760])}" style="fill:var(--wallside)"/>`;
  s += `<polygon points="${poly([1600,0],TR,BR,[1600,760])}" style="fill:var(--wallside)"/>`;
  s += `<polygon points="${poly(TL,TR,BR,BL)}" style="fill:var(--backwall)"/>`;
  s += `<polygon points="${poly(BL,BR,[1600,760],[0,760])}" style="fill:var(--floor)"/>`;
  // floor seams (atmosphere layer)
  for (let X = 0; X <= 1600; X += 200) s += `<line x1="${X}" y1="760" x2="${P(X,760,KB)[0]}" y2="${P(X,760,KB)[1]}" style="stroke:var(--floorline)" stroke-width="2"/>`;
  [0.55, 0.68, 0.83].forEach(k => { const a = P(0,760,k), b = P(1600,760,k); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--floorline)" stroke-width="2"/>`; });
  // ceiling tiles
  for (let X = 0; X <= 1600; X += 160) { const b = P(X,0,KB); s += `<line x1="${X}" y1="0" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--dim)" stroke-width="2"/>`; }
  [0.52, 0.62, 0.74, 0.88].forEach(k => { const a = P(0,0,k), b = P(1600,0,k); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--dim)" stroke-width="2"/>`; });
  // room edges
  s += `<polyline points="${poly([0,0],TL,TR,[1600,0])}" fill="none" style="stroke:var(--line)" stroke-width="2.5"/>`;
  s += `<polyline points="${poly([0,760],BL,BR,[1600,760])}" fill="none" style="stroke:var(--line)" stroke-width="2.5"/>`;
  s += `<line x1="${TL[0]}" y1="${TL[1]}" x2="${BL[0]}" y2="${BL[1]}" style="stroke:var(--line)" stroke-width="2.5"/>`;
  s += `<line x1="${TR[0]}" y1="${TR[1]}" x2="${BR[0]}" y2="${BR[1]}" style="stroke:var(--line)" stroke-width="2.5"/>`;
  // chair rail along back wall (atmosphere)
  s += `<line x1="${TL[0]}" y1="410" x2="${TR[0]}" y2="410" style="stroke:var(--dim)" stroke-width="2"/>`;

  // projector on ceiling + beam (day)
  s += `<g class="day-only"><polygon points="790,58 810,58 1050,150 1050,372 560,372 560,150" style="fill:var(--beam)"/></g>`;
  s += `<rect x="772" y="40" width="56" height="20" rx="4" style="fill:#000;stroke:var(--line)" stroke-width="2.5"/>
        <circle cx="800" cy="58" r="5" style="fill:var(--white)" class="day-only" filter="url(#glow)"/>
        <line x1="800" y1="0" x2="800" y2="40" style="stroke:var(--line)" stroke-width="2.5"/>`;

  // SCREEN (big color field by day)
  s += `<rect x="560" y="150" width="490" height="222" rx="4" style="fill:var(--screenglow)" filter="url(#bloom)" opacity=".55" class="day-only"/>`;
  s += `<g data-hs="screen">
    <rect x="560" y="150" width="490" height="222" rx="4" style="fill:var(--screen);stroke:var(--white)" stroke-width="3"/>
    <g clip-path="url(#screenClip)" class="day-only">${slide()}</g>
    <g class="night-only" opacity=".09">${brainBlob(700, 280, 1, "none", "#9db0ff", 3)}</g>
  </g>`;
  s += `<line x1="560" y1="378" x2="1050" y2="378" style="stroke:var(--line)" stroke-width="3"/>`;

  // clock
  s += `<g data-hs="clock"><circle cx="1104" cy="200" r="22" style="fill:#000;stroke:var(--line)" stroke-width="3"/>
        <line class="day-only" x1="1104" y1="200" x2="1104" y2="186" style="stroke:var(--white)" stroke-width="3" stroke-linecap="round"/>
        <line class="day-only" x1="1104" y1="200" x2="1116" y2="204" style="stroke:var(--white)" stroke-width="3" stroke-linecap="round"/>
        <line class="night-only" x1="1104" y1="200" x2="1112" y2="190" style="stroke:var(--white)" stroke-width="3" stroke-linecap="round"/>
        <line class="night-only" x1="1104" y1="200" x2="1106" y2="216" style="stroke:var(--white)" stroke-width="3" stroke-linecap="round"/></g>`;

  // DOOR on left wall + EXIT sign
  const d1 = P(0,300,0.62), d2 = P(0,300,0.80), d3 = P(0,760,0.80), d4 = P(0,760,0.62);
  s += `<g data-hs="door"><polygon points="${poly(d1,d2,d3,d4)}" style="fill:#000;stroke:var(--line)" stroke-width="3"/>
        <line x1="${P(0,520,0.77)[0]}" y1="${P(0,520,0.77)[1]}" x2="${P(0,520,0.77)[0]}" y2="${P(0,520,0.77)[1]+18}" style="stroke:var(--white)" stroke-width="4" stroke-linecap="round"/></g>`;
  const e1 = P(0,232,0.64), e2 = P(0,232,0.78), e3 = P(0,272,0.78), e4 = P(0,272,0.64);
  s += `<g data-hs="exit"><polygon points="${poly(e1,e2,e3,e4)}" style="fill:var(--exit)" class="exitsign"/>
        <text x="${(e1[0]+e2[0])/2}" y="${(e1[1]+e4[1]+e2[1]+e3[1])/4 + 5}" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="17" fill="#000" transform="rotate(-6 ${(e1[0]+e2[0])/2} ${(e1[1]+e3[1])/2})">EXIT</text></g>`;

  // PNEUMATIC TUBE on right wall
  const tx = P(1600,0,0.85)[0];
  const ty0 = P(1600,0,0.85)[1], ty1 = P(1600,760,0.85)[1];
  const b1 = P(1600,330,0.80), b2 = P(1600,330,0.90), b3 = P(1600,480,0.90), b4 = P(1600,480,0.80);
  s += `<g data-hs="tube">
    <line x1="${tx-9}" y1="${ty0}" x2="${tx-9}" y2="${ty1}" style="stroke:var(--line)" stroke-width="3"/>
    <line x1="${tx+9}" y1="${ty0}" x2="${tx+9}" y2="${ty1}" style="stroke:var(--line)" stroke-width="3"/>
    ${[0.12,0.3,0.7,0.88].map(f => { const y = ty0 + (ty1-ty0)*f; return `<line x1="${tx-14}" y1="${y}" x2="${tx+14}" y2="${y}" style="stroke:var(--line)" stroke-width="5"/>`; }).join("")}
    <polygon points="${poly(b1,b2,b3,b4)}" style="fill:#000;stroke:var(--orange)" stroke-width="3"/>
    <polygon points="${poly(P(1600,360,0.82),P(1600,360,0.88),P(1600,440,0.88),P(1600,440,0.82))}" style="fill:var(--sel);stroke:var(--line)" stroke-width="2"/>
    <circle cx="${P(1600,345,0.85)[0]}" cy="${P(1600,345,0.85)[1]}" r="5" style="fill:var(--green)" filter="url(#glow)"/>
    <rect x="${tx-30}" y="${ty0}" width="60" height="${ty1-ty0}" fill="transparent"/>
  </g>`;
  s += `<g id="canister" class="noanim" opacity="0"><rect x="${tx-8}" y="-32" width="16" height="32" rx="7" style="fill:var(--yellow)" filter="url(#glow)"/>
        <text x="${tx+16}" y="-10" font-family="Space Mono, monospace" font-weight="700" font-size="16" style="fill:var(--yellow)">B3</text></g>`;

  // MORRIS in ajar ceiling tile
  const m1 = P(1120,0,0.62), m2 = P(1280,0,0.62), m3 = P(1280,0,0.74), m4 = P(1120,0,0.74);
  s += `<g data-hs="morris">
    <polygon points="${poly(m4,m3,m2,m1)}" style="fill:#000;stroke:var(--line)" stroke-width="2.5"/>
    <polygon points="${poly(m4,m3,[m3[0]+8,m3[1]-14],[m4[0]+8,m4[1]-14])}" style="fill:var(--dim2);stroke:var(--line)" stroke-width="2"/>
    <g class="ratEyes"><circle cx="1058" cy="72" r="5" style="fill:var(--yellow)" filter="url(#glow)"/><circle cx="1076" cy="72" r="5" style="fill:var(--yellow)" filter="url(#glow)"/></g>
    <path class="tail" d="M1090,84 C1094,104 1080,118 1092,138 C1100,152 1094,160 1098,168" fill="none" style="stroke:var(--pink)" stroke-width="4" stroke-linecap="round"/>
    <rect x="1030" y="50" width="90" height="125" fill="transparent"/>
  </g>`;
  return s;
}

function brainBlob(cx, cy, sc, fill, stroke, sw) {
  const d = "M-95,10 C-100,-40 -55,-70 -10,-62 C20,-80 70,-66 88,-30 C112,-6 100,40 70,52 C40,72 -20,70 -50,58 C-85,52 -98,34 -95,10 Z";
  return `<path d="${d}" transform="translate(${cx},${cy}) scale(${sc})" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
}
function slide() {
  const layerCols = ["#ff6b35", "#ffd23f", "#2ee6a8", "#3d8bff", "#9b6bff", "#ff4d8d"];
  let s = `<text x="582" y="186" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="24" fill="#0b0d14">LAMINAR fMRI AT 7T</text>
    <text x="582" y="206" font-family="Space Mono, monospace" font-size="11" fill="#4b5068">six layers · zero noise · one author who "ran every subject"</text>
    <circle cx="1018" cy="180" r="18" fill="#ff6b35"/><text x="1018" y="186" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="15" fill="#fff">7T</text>`;
  layerCols.forEach((c, i) => { s += brainBlob(690, 290, 0.78 - i * 0.12, c, "#0b0d14", 2); });
  // bar chart with absurdly tiny error bars
  s += `<line x1="830" y1="350" x2="1030" y2="350" stroke="#0b0d14" stroke-width="2"/><line x1="830" y1="350" x2="830" y2="232" stroke="#0b0d14" stroke-width="2"/>`;
  [[850,70,"#5d6378"],[905,104,"#ff6b35"],[960,40,"#5d6378"]].forEach(([x,h,c]) => {
    s += `<rect x="${x}" y="${350-h}" width="38" height="${h}" fill="${c}"/><line x1="${x+19}" y1="${350-h-3}" x2="${x+19}" y2="${350-h+3}" stroke="#0b0d14" stroke-width="2"/>`;
  });
  s += `<text x="905" y="236" font-family="Space Mono, monospace" font-size="11" fill="#0b0d14">p &lt; .0000001</text>
    <text x="582" y="364" font-family="Space Mono, monospace" font-size="10" fill="#4b5068">Valu P., Impact M. (2026) Nurture Neuroscience</text>`;
  return s;
}

/* ------------------------------------------------------------------ *
 *  FURNITURE ROWS (sortable by depth)
 * ------------------------------------------------------------------ */
const ROWS = [0.62, 0.76, 0.92];
const SEATS_L = [630, 480, 330], SEATS_R = [970, 1120, 1270];
function chair(x, y, k) {
  const w = 76 * k, h = 50 * k;
  return `<g style="stroke:var(--dim)" stroke-width="${2.5}">
    <rect x="${x - w/2}" y="${y - 72*k}" width="${w}" height="${h}" rx="${10*k}" style="fill:#000;stroke:var(--line)" stroke-width="2.5"/>
    <line x1="${x - w/2 + 6*k}" y1="${y - 22*k}" x2="${x - w/2 + 4*k}" y2="${y}" />
    <line x1="${x + w/2 - 6*k}" y1="${y - 22*k}" x2="${x + w/2 - 4*k}" y2="${y}" />
  </g>`;
}
// seated person seen from behind: shoulders + head, chair back drawn after (occludes)
function sitter(x, y, k, o = {}) {
  const head = o.head || "var(--dim)", body = o.body || "var(--dim2)";
  let s = `<g ${o.hs ? `data-hs="${o.hs}"` : ""} class="${o.cls || ""}">
    <g class="${o.nod ? "nod" : ""}">

function addScore(key, n) {
  if (!key || state.scored.has(key)) return;

  el.animate([{ transform: "translateY(-6px)", fill: "#ffd23f" }, { transform: "translateY(0)" }], { duration: 500 });
  blip();
}
let actx = null;
function blip() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [660, 990].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * .09);
      g.gain.exponentialRampToValueAtTime(0.05, t + i * .09 + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + i * .09 + .12);
      o.connect(g).connect(actx.destination); o.start(t + i * .09); o.stop(t + i * .09 + .14);
    });
  } catch (e) {}
}
function fmt(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>"); }

// typewriter into an element; resolves when clicked after finishing
function typeInto(el, html, speed, onTick) {
  return new Promise(resolve => {
    let i = 0, done = false; const plain = html;
    el.innerHTML = "";
    // tokenise so tags (<br>, <em>) appear whole
    const tokens = plain.match(/<[^>]+>|&[a-z]+;|[\s\S]/g) || [];
    const timer = setInterval(() => {
      if (i >= tokens.length) { finish(); return; }
      el.innerHTML += tokens[i++]; onTick && onTick(true);
    }, speed);
    function finish() { clearInterval(timer); el.innerHTML = plain; done = true; onTick && onTick(false); }
    function click(e) {
      e.stopPropagation();
      if (!done) { finish(); return; }
      cleanup(); resolve();
    }
    function cleanup() { frame.removeEventListener("pointerdown", click, true); }
    frame.addEventListener("pointerdown", click, true);
  });
}
async function say(text) {
  state.busy = true;
  let who = "", body = text;
  if (text.includes("|")) { [who, body] = text.split("|"); }
  msg.innerHTML = `${who ? `<span class="who" style="color:var(--yellow)">${fmt(who)}:</span> ` : ""}<span class="t"></span><span class="more">click ▸</span>`;
  msg.classList.add("show");
  await typeInto($(".t", msg), fmt(body), state.mode === "night" ? 30 : 18);
  msg.classList.remove("show");
  state.busy = false;
}

/* ------------------------------------------------------------------ *
 *  CONVERSATIONS (portrait close-ups)
 * ------------------------------------------------------------------ */
const convo = $("#convo"), dlg = $("#dlg");
const pf = { L: $(".pframe.left"), R: $(".pframe.right") };
let blinkTimers = [];
function mountPortrait(side, id) {
  const p = PORTRAIT[id];
  pf[side].querySelector(".pv").innerHTML = `<svg viewBox="0 0 400 460" class="pt" data-id="${id}">${p.svg()}</svg>`;
  pf[side].querySelector(".plate").textContent = p.name;
  pf[side].querySelector(".plate").style.color = p.color;
  const el = pf[side].querySelector("svg");
  const blink = () => { el.classList.add("bl"); setTimeout(() => el.classList.remove("bl"), 130); blinkTimers.push(setTimeout(blink, 1800 + Math.random() * 3200)); };
  blinkTimers.push(setTimeout(blink, 900 + Math.random() * 1500));
  return el;
}
async function runConvo(key) {
  const c = CONVOS[key];
  state.busy = true; hover.classList.remove("show");
  const els = { L: mountPortrait("L", c.L), R: mountPortrait("R", c.R) };
  convo.classList.add("show");
  for (const [side, raw, fx] of c.lines) {
    pf.L.classList.toggle("speaking", side === "L"); pf.R.classList.toggle("speaking", side === "R");
    let text = raw, sub = "";
    if (raw.includes("|")) [text, sub] = raw.split("|");
    if (side === "N") {
      pf.L.classList.remove("speaking"); pf.R.classList.remove("speaking");
      dlg.querySelector(".who").textContent = "NARRATOR"; dlg.querySelector(".who").style.color = "var(--line)";
    } else {
      const p = PORTRAIT[c[side]];
      dlg.querySelector(".who").textContent = p.name; dlg.querySelector(".who").style.color = p.color;
    }
    const sp = side === "N" ? null : els[side];
    if (sp) sp.classList.toggle("blank", fx === "blank");
    if (fx === "blank") { const ps = $("#preston"); ps && ps.classList.add("blank", "pulsing"); }
    let flap = 0;
    const html = fmt(text) + (sub ? `<br><em>${fmt(sub)}</em>` : "");
    await typeInto(dlg.querySelector(".txt"), html, state.mode === "night" ? 30 : 20, (on) => {
      if (!sp) return;
      if (on) { if (++flap % 3 === 0) sp.classList.toggle("mo"); } else sp.classList.remove("mo");
    });
    if (sp) { sp.classList.remove("mo"); if (fx === "blank") sp.classList.remove("blank"); }
    if (fx === "blank") { const ps = $("#preston"); ps && ps.classList.remove("blank", "pulsing"); }
  }
  blinkTimers.forEach(clearTimeout); blinkTimers = [];
  convo.classList.remove("show");
  if (c.score) addScore(...c.score);
  state.busy = false;
}

/* ------------------------------------------------------------------ *
 *  INPUT
 * ------------------------------------------------------------------ */
function svgPoint(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function hsFrom(target) {
  const el = target.closest && target.closest("[data-hs]");
  if (!el) return null;
  const id = el.dataset.hs, h = HS[id];
  if (!h || !h[state.mode] || state.taken.has(id)) return null;
  return id;
}
const VERBLABEL = { walk: "Walk to", look: "Look at", use: "Use", talk: "Talk to" };
frame.addEventListener("pointermove", (e) => {
  if (state.busy) { hover.classList.remove("show"); return; }
  const id = hsFrom(e.target), item = e.target.closest && e.target.closest("[data-item]");
  let label = "";
  if (id) label = `${VERBLABEL[state.verb]} ${HS[id].label}`;
  else if (item) label = `Look at ${ITEMS[item.dataset.item].name}`;
  else if (e.target.closest && e.target.closest(".verb")) label = "";
  if (!label) { hover.classList.remove("show"); return; }
  const r = frame.getBoundingClientRect();
  hover.textContent = label; hover.classList.add("show");
  hover.style.left = (e.clientX - r.left + 16) + "px"; hover.style.top = (e.clientY - r.top + 18) + "px";
});
frame.addEventListener("contextmenu", (e) => { e.preventDefault(); if (state.busy) return; setVerb(VERBS[(VERBS.indexOf(state.verb) + 1) % VERBS.length]); });
window.addEventListener("keydown", (e) => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4 && !state.busy) setVerb(VERBS[n - 1]); });

svg.addEventListener("click", (e) => {
  if (state.busy) return;
  const verbEl = e.target.closest(".verb");
  if (verbEl) { setVerb(verbEl.dataset.verb); return; }
  if (e.target.closest("#toggle")) { toggleMode(); return; }
  const item = e.target.closest("[data-item]");
  if (item) { say(ITEMS[item.dataset.item].look); return; }
  const p = svgPoint(e);
  if (p.y > 760) return;
  const id = hsFrom(e.target);
  if (id) { act(id); return; }
  if (state.verb !== "walk") setVerb("walk");
  walkTo(p.x, p.y);
});

function act(id) {
  const h = HS[id][state.mode], v = state.verb;
  if (v === "walk") { const s = STAND[id]; if (s) walkTo(s[0], s[1]); return; }
  if (v === "look") { say(h.look); if (h.score && h.look) addScore(...h.score); return; }
  const resp = h[v] || (v === "talk" ? "There's no answer. Not even a squeak." : "Nothing happens. Academia in a nutshell.");
  const go = () => {
    if (CONVOS[resp]) runConvo(resp);
    else {
      say(resp);
      if (v === "use" && h.score) addScore(...h.score);
      if (v === "use" && h.take) { state.taken.add(id); const el = document.getElementById(id); el && el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: "forwards" }); }
    }
  };
  const s = STAND[id];
  if (s) walkTo(s[0], s[1], go); else go();
}

/* ------------------------------------------------------------------ *
 *  MOVEMENT
 * ------------------------------------------------------------------ */
function clampFloor(x, y) {
  y = Math.max(478, Math.min(752, y));
  const k = kAtY(y), half = 800 * k - 30;
  x = Math.max(800 - half, Math.min(800 + half, x));
  return [x, y];
}
function walkTo(x, y, cb) {
  const a = state.actor;
  [a.tx, a.ty] = clampFloor(x, y);
  a.onArrive = cb || null;
  a.walking = true;
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const a = state.actor;
  if (a.walking) {
    const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
    const k = kAtY(a.y), speed = 330 * k;
    if (dist < 3) {
      a.walking = false; a.x = a.tx; a.y = a.ty;
      const cb = a.onArrive; a.onArrive = null; cb && cb();
    } else {
      const step = Math.min(dist, speed * dt);
      a.x += dx / dist * step; a.y += dy / dist * step * 0.85 + (dy / dist) * step * 0.15;
      if (Math.abs(dx) > 2) a.dir = dx > 0 ? 1 : -1;
      a.t += dt;
    }
  }
  renderActor();
  requestAnimationFrame(tick);
}
let lastSortY = -1;
function renderActor() {
  const a = state.actor, k = kAtY(a.y);
  $("#actor").setAttribute("transform", `translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${(k * a.dir).toFixed(3)},${k.toFixed(3)})`);
  const sw = a.walking ? Math.sin(a.t * 11) : 0;
  const L = actorInner.querySelector(".legL"), R = actorInner.querySelector(".legR");
  if (L) { L.setAttribute("x2", -16 + sw * 16); R.setAttribute("x2", 16 - sw * 16); }
  const bob = actorInner.querySelector(".bob");
  if (bob) bob.setAttribute("transform", `translate(0,${a.walking ? -Math.abs(Math.sin(a.t * 11)) * 5 : 0})`);
  const af = actorInner.querySelector(".armF"), ab = actorInner.querySelector(".armB");
  if (af && state.mode === "day") { af.setAttribute("x2", 48 - sw * 14); actorInner.querySelector(".handF").setAttribute("cx", 49 - sw * 14); }
  if (ab) ab.setAttribute("x2", -48 + sw * 14);
  // depth sort
  if (Math.abs(a.y - lastSortY) > 1) {
    lastSortY = a.y;
    const kids = [...sortables.children].filter(c => c !== actorWrap);
    const after = kids.find(c => parseFloat(c.dataset.depth) > a.y);
    sortables.insertBefore(actorWrap, after || null);
  }
}

/* ------------------------------------------------------------------ *
 *  AMBIENT: canister, Preston's earbud pulse
 * ------------------------------------------------------------------ */
const can = $("#canister");
function dropCanister() {
  const y0 = 30, y1 = 690;
  can.setAttribute("opacity", 1);
  can.animate([{ transform: `translateY(${y0}px)` }, { transform: `translateY(${y1}px)` }], { duration: 1100, easing: "cubic-bezier(.5,0,1,1)" })
    .onfinish = () => can.setAttribute("opacity", 0);
  setTimeout(dropCanister, state.mode === "night" ? 3500 + Math.random() * 2500 : 9000 + Math.random() * 5000);
}
setTimeout(dropCanister, 2500);
function prestonPulse() {
  const p = $("#preston");
  if (p && state.mode === "day" && !state.busy) {
    p.classList.add("pulsing", "blank");
    setTimeout(() => p.classList.remove("pulsing", "blank"), 650);
  }
  const arm = $("#prestonArm");
  if (arm) arm.setAttribute("y2", Math.random() < .5 ? -262 : -232);
  setTimeout(prestonPulse, 5000 + Math.random() * 4000);
}
setTimeout(prestonPulse, 4000);

/* ------------------------------------------------------------------ *
 *  DAY / NIGHT
 * ------------------------------------------------------------------ */
const card = $("#card");
function showCard() {
  const night = state.mode === "night";
  card.querySelector(".day").textContent = night ? "MONDAY NIGHT" : "MONDAY";
  card.querySelector(".act").textContent = night ? "NIGHT SHIFT · GUS" : "ACT I · SUBMISSION";
  card.querySelector(".sub").textContent = night ? "Seminar Room 101 · 2:13 AM" : "Journal Club · Seminar Room 101 · 4:07 PM";
  card.querySelector(".act").style.color = night ? "#29d3c0" : "#ffd23f";
  card.classList.add("show");
  state.busy = true;
  const hide = () => { card.classList.remove("show"); state.busy = false; card.removeEventListener("click", hide); };
  card.addEventListener("click", hide);
  setTimeout(hide, 2400);
}
function toggleMode() {
  state.mode = state.mode === "day" ? "night" : "day";
  frame.classList.toggle("night", state.mode === "night");
  $("#flash").classList.remove("go"); void $("#flash").offsetWidth; $("#flash").classList.add("go");
  $("#toggleTxt").textContent = state.mode === "night" ? "DAY SHIFT" : "NIGHT SHIFT";
  $("#toggleSub").textContent = state.mode === "night" ? "◂ back to Ned" : "switch to Gus ▸";
  const a = state.actor;
  if (state.mode === "night") { a.x = 330; a.y = 720; a.dir = 1; } else { a.x = 800; a.y = 735; a.dir = 1; }
  a.walking = false; a.onArrive = null; lastSortY = -1;
  drawActor(); drawBadge(); drawInv(); showCard();
}

/* go */
drawActor(); drawBadge(); drawInv(); setVerb("walk"); showCard();
requestAnimationFrame(tick);
})();
</script>
</body>
