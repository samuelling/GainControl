<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gain Control — The Fog (stairwell test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="stage">
  <div id="frame">
    <div id="panel"></div>
    <div id="death"><svg class="t" viewBox="0 0 640 360"></svg><div class="dtxt"></div></div>
  </div>
</div>
<script type="module">
  import { segC } from "./js/gfx.js";
  import { stairwell } from "./js/minigames/stairwell.js";
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>");
  // the game's death screen, with Revise & Resubmit
  function die(text) {
    return new Promise(resolve => {
      const d = document.getElementById("death");
      d.querySelector("svg").innerHTML = segC("DESK REJECTED", 320, 26, 26, "sR", 1.8)
        + `<g class="dbtn" data-b="revise"><rect class="fW" x="150" y="300" width="160" height="26"/>${segC("REVISE & RESUBMIT", 230, 309, 7, "s0", 1.2)}</g>`
        + `<g class="dbtn" data-b="withdraw"><rect class="k sW" x="330" y="300" width="160" height="26"/>${segC("WITHDRAW MANUSCRIPT", 410, 309, 7, "sW", 1.2)}</g>`;
      d.querySelector(".dtxt").innerHTML = esc(text); d.classList.add("show");
      d.onclick = (e) => { const b = e.target.closest(".dbtn"); if (!b) return; d.classList.remove("show"); d.onclick = null;
        if (b.dataset.b === "withdraw") location.reload(); else resolve("revise"); };
    });
  }
  const r = await stairwell(document.getElementById("panel"), { die, chip: "TEST BUILD   ACT IV   STAIRWELL B" });
  console.log("stairwell", r);
  location.reload();
</script>
</body>
</html>
