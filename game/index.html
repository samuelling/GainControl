<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gain Control — Act I: Submission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="stage">
  <div id="frame">
    <svg class="t" id="game" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg class="t" id="readout" viewBox="0 0 640 360"></svg>
    <div id="hover"></div>
    <div id="msg"></div>
    <div id="convo">
      <div class="pf left"><div class="pv"></div><span class="who name"></span></div>
      <div class="pf right"><div class="pv"></div><span class="who name"></span></div>
      <div id="dlg"><span class="who"></span><div class="txt"></div><span class="more">CLICK ▸</span></div>
    </div>
    <svg class="t" id="card" viewBox="0 0 640 360"></svg>
    <div id="death"><svg class="t" viewBox="0 0 640 360"></svg><div class="dtxt"></div></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
